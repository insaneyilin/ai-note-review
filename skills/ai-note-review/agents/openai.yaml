interface:
  display_name: "AI Note Review"
  short_description: "Review new Obsidian notes for value and fit"
  default_prompt: "Use $ai-note-review to review a new Obsidian note before adding it to the knowledge base."
dependencies:
  tools:
    - type: "mcp"
      value: "obsidian"
      description: "An Obsidian MCP server with indexed search, semantic search, metadata, and path-specific file tools"
policy:
  allow_implicit_invocation: true
